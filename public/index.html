<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Student Record Management System</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>

  <header>
    <h1>Student Record Management System</h1>
    <p>Full-Stack CRUD Demo &mdash; Express + MongoDB (Mongoose) + Vanilla JS</p>
  </header>

  <main>
    <section class="card">
      <h2 id="formTitle">Add Student</h2>
      <form id="studentForm" novalidate>
        <input type="hidden" id="studentId" />

        <div class="field">
          <label for="name">Name</label>
          <input type="text" id="name" required />
          <span class="error" id="nameError"></span>
        </div>

        <div class="field">
          <label for="rollNo">Roll No.</label>
          <input type="text" id="rollNo" required />
          <span class="error" id="rollNoError"></span>
        </div>

        <div class="field">
          <label for="course">Course</label>
          <input type="text" id="course" required />
          <span class="error" id="courseError"></span>
        </div>

        <div class="field">
          <label for="marks">Marks (0-100)</label>
          <input type="number" id="marks" min="0" max="100" step="0.01" required />
          <span class="error" id="marksError"></span>
        </div>

        <div class="form-actions">
          <button type="submit" id="submitBtn">Add Student</button>
          <button type="button" id="cancelEditBtn" class="secondary hidden">Cancel</button>
        </div>

        <p id="formMessage" class="form-message"></p>
      </form>
    </section>

    <section class="card">
      <div class="table-header">
        <h2>Student Records</h2>
        <button id="refreshBtn" class="secondary">Refresh</button>
      </div>
      <p id="listMessage" class="form-message"></p>
      <div class="table-wrapper">
        <table id="studentTable">
          <thead>
            <tr>
              <th>Name</th>
              <th>Roll No.</th>
              <th>Course</th>
              <th>Marks</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="studentTableBody">
            <!-- Rows injected by script.js -->
          </tbody>
        </table>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
